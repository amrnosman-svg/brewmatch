[build]
  publish = "."
  functions = "netlify/functions"

# Machine photos rarely change: let browsers cache them for 30 days.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Old Netlify address -> permanent (301) redirect to the real domain, path and query kept.
# Functions stay reachable on the old host so existing tooling and tests keep working.
[[redirects]]
  from = "https://brewtimeai.netlify.app/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://brewtimeai.netlify.app/*"
  to = "https://getbrewharbor.com/:splat"
  status = 301
  force = true

# Public recommendation API (agents/tools): same scoring as the quiz.
[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200

# Slugs now strip accents: keep the one old machine URL that contained one working
[[redirects]]
  from = "/machines/ninja-luxe-caf-premier/*"
  to = "/machines/ninja-luxe-cafe-premier/"
  status = 301

# Machines renamed or replaced in October 2026
