[build]
  publish = "."
  functions = "netlify/functions"

# Machine photos rarely change: let browsers cache them for 30 days.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Public recommendation API (agents/tools): same scoring as the quiz.
[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200
